name: MLOps CI
on: [push]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Lint
        run: flake8 src/ --max-line-length=120 || true
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v